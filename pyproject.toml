[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camcam"
version = "1.0.0"
description = "Wireless and Auto Shutter PTP Camera App for Nikon D3100 on Raspberry Pi 4"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "CamCam Developer" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pillow>=9.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gphoto = [
    "gphoto2>=2.4.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
camcam = "camcam.cli:main"
